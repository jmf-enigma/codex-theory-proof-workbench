interface:
  display_name: "Theory Proof Workbench"
  short_description: "Find a natural route, verify it, and recover hard proofs"
  default_prompt: "Use $theory-proof-workbench. Preserve the exact claim, try one mathematically motivated route end to end, escalate only a named obstruction, use bounded hard exploration only after two distinct route failures, and send complete candidates to an independent verifier."
policy:
  allow_implicit_invocation: true
